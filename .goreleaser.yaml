project_name: flare

# Docker Hub 命名空间可配置：设置环境变量 DOCKER_IMAGE(如 your-name/flare)即可覆盖；
# 未设置时回退到上游默认 soulteary/flare。
env:
  - IMAGE={{ if isEnvSet "DOCKER_IMAGE" }}{{ .Env.DOCKER_IMAGE }}{{ else }}soulteary/flare{{ end }}

before:
  hooks:
    - go run build/build.go

builds:
  - <<: &build_defaults
      env:
        - CGO_ENABLED=0
      ldflags:
        - -w -s -X "github.com/soulteary/version-kit.Version={{ .Tag }}" -X "github.com/soulteary/version-kit.Commit={{.Commit}}" -X "github.com/soulteary/version-kit.BuildDate={{.Date}}"
    id: macos
    goos: [ darwin ]
    goarch: [ amd64, arm64 ]

  - <<: *build_defaults
    id: linux
    goos: [linux]
    goarch: ["386", arm, amd64, arm64]
    goarm:
      - "7"
      - "6"

dockers:

  - image_templates:
      - "{{ .Env.IMAGE }}:linux-amd64-{{ .Tag }}"
      - "{{ .Env.IMAGE }}:linux-amd64"
    dockerfile: docker/goreleaser/Dockerfile.amd64
    use: buildx
    goarch: amd64
    build_flag_templates:
      - "--pull"
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description={{ .ProjectName }}"
      - "--label=org.opencontainers.image.url=https://github.com/soulteary/flare"
      - "--label=org.opencontainers.image.source=https://github.com/soulteary/flare"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=AGPL-v3"

  - image_templates:
      - "{{ .Env.IMAGE }}:linux-arm64-{{ .Tag }}"
      - "{{ .Env.IMAGE }}:linux-arm64"
    dockerfile: docker/goreleaser/Dockerfile.arm64v8
    use: buildx
    goos: linux
    goarch: arm64
    goarm: ''
    build_flag_templates:
      - "--pull"
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description={{ .ProjectName }}"
      - "--label=org.opencontainers.image.url=https://github.com/soulteary/flare"
      - "--label=org.opencontainers.image.source=https://github.com/soulteary/flare"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=AGPL-v3"

  - image_templates:
      - "{{ .Env.IMAGE }}:linux-armv7-{{ .Tag }}"
      - "{{ .Env.IMAGE }}:linux-armv7"
    dockerfile: docker/goreleaser/Dockerfile.arm32v7
    use: buildx
    goos: linux
    goarch: arm
    goarm: "7"
    build_flag_templates:
      - "--pull"
      - "--platform=linux/arm/v7"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description={{ .ProjectName }}"
      - "--label=org.opencontainers.image.url=https://github.com/soulteary/flare"
      - "--label=org.opencontainers.image.source=https://github.com/soulteary/flare"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=AGPL-v3"

  - image_templates:
      - "{{ .Env.IMAGE }}:linux-armv6-{{ .Tag }}"
      - "{{ .Env.IMAGE }}:linux-armv6"
    dockerfile: docker/goreleaser/Dockerfile.arm32v6
    use: buildx
    goos: linux
    goarch: arm
    goarm: "6"
    build_flag_templates:
      - "--pull"
      - "--platform=linux/arm/v6"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description={{ .ProjectName }}"
      - "--label=org.opencontainers.image.url=https://github.com/soulteary/flare"
      - "--label=org.opencontainers.image.source=https://github.com/soulteary/flare"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=AGPL-v3"


docker_manifests:
  - name_template: "{{ .Env.IMAGE }}:{{ .Tag }}"
    image_templates:
      - "{{ .Env.IMAGE }}:linux-amd64-{{ .Tag }}"
      - "{{ .Env.IMAGE }}:linux-arm64-{{ .Tag }}"
      - "{{ .Env.IMAGE }}:linux-armv7-{{ .Tag }}"
      - "{{ .Env.IMAGE }}:linux-armv6-{{ .Tag }}"
    skip_push: "false"

  - name_template: "{{ .Env.IMAGE }}:latest"
    image_templates:
      - "{{ .Env.IMAGE }}:linux-amd64-{{ .Tag }}"
      - "{{ .Env.IMAGE }}:linux-arm64-{{ .Tag }}"
      - "{{ .Env.IMAGE }}:linux-armv7-{{ .Tag }}"
      - "{{ .Env.IMAGE }}:linux-armv6-{{ .Tag }}"
    skip_push: "false"